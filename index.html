<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolt Brigade</title>
<meta name="description" content="Bolt Brigade — a fast-paced tank arcade game for iOS. 200 hand-crafted levels, 20 boss fights, LAN co-op.">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 0%, #1c2333 0%, #0b0e16 60%);
    color: #e8ecf4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 24px;
  }
  .card { max-width: 520px; }
  .logo {
    width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 28px;
    background: linear-gradient(160deg, #ffd84d, #f5a623);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; box-shadow: 0 18px 50px rgba(245,166,35,.28);
  }
  h1 { font-size: 2.6rem; letter-spacing: -.02em; margin-bottom: 14px; }
  p.tag { font-size: 1.1rem; line-height: 1.6; color: #aab3c5; margin-bottom: 34px; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 600;
    color: #0b0e16; background: #e8ecf4; padding: 14px 30px; border-radius: 999px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(232,236,244,.18); }
  footer { margin-top: 56px; font-size: .85rem; color: #5f6878; }
  footer a { color: #8a93a6; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🛡️</div>
    <h1>Bolt Brigade</h1>
    <p class="tag">A fast-paced tank arcade game for iOS — 200 hand-crafted levels, 20 boss fights, and local LAN co-op.</p>
    <a class="btn" href="https://apps.apple.com/app/id6769092885">Download on the App Store</a>
    <footer>
      Contact: <a href="mailto:gijirokuman@gmail.com">gijirokuman@gmail.com</a>
    </footer>
  </main>
</body>
</html>
